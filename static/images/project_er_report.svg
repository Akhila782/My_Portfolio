<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C811"/>
      <stop offset="100%" stop-color="#D9A406"/>
    </linearGradient>
    <linearGradient id="pbiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D5C63" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D5C63" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" rx="24" ry="24" fill="#f7f4ee"/>
  
  <!-- Power BI ER dashboard application window mockup -->
  <rect x="50" y="90" width="460" height="220" rx="16" fill="#fff" stroke="#d8d4ce" stroke-width="2"/>
  
  <!-- Power BI Ribbon Header -->
  <rect x="50" y="90" width="460" height="35" rx="16" fill="#f3f2f1"/>
  <rect x="50" y="105" width="460" height="20" fill="#f3f2f1"/>
  
  <!-- Power BI Logo Columns -->
  <rect x="65" y="98" width="4" height="12" fill="#F2C811" rx="1"/>
  <rect x="72" y="95" width="4" height="15" fill="#F2B80F" rx="1"/>
  <rect x="79" y="92" width="4" height="18" fill="#D9A406" rx="1"/>
  
  <text x="92" y="110" font-family="Inter, sans-serif" font-size="10" fill="#252423" font-weight="700">Microsoft Power BI - ER Triage Analytics</text>
  
  <!-- Left Sidebar Panel: Filters & Slicers -->
  <rect x="65" y="135" width="115" height="160" rx="8" fill="#faf9f8" stroke="#e1dfdd" stroke-width="1"/>
  <text x="75" y="152" font-family="Inter, sans-serif" font-size="9" fill="#323130" font-weight="700">Slicers &amp; Filters</text>
  
  <!-- Slicer categories -->
  <rect x="75" y="162" width="95" height="18" rx="4" fill="#eae8e6" stroke="#c8c6c4" stroke-width="1"/>
  <text x="82" y="174" font-family="Inter, sans-serif" font-size="8" fill="#323130" font-weight="600">All Facilities</text>
  
  <rect x="75" y="186" width="95" height="18" rx="4" fill="#0D5C63" stroke="#0D5C63" stroke-width="1"/>
  <text x="82" y="198" font-family="Inter, sans-serif" font-size="8" fill="#fff" font-weight="600">High Triage [x]</text>
  
  <rect x="75" y="210" width="95" height="18" rx="4" fill="#eae8e6" stroke="#c8c6c4" stroke-width="1"/>
  <text x="82" y="222" font-family="Inter, sans-serif" font-size="8" fill="#323130" font-weight="600">Last 30 Days</text>
  
  <!-- DAX automated metric card -->
  <text x="75" y="248" font-family="Inter, sans-serif" font-size="8.5" fill="#605e5c" font-weight="600">Automation Saving</text>
  <text x="75" y="265" font-family="Inter, sans-serif" font-size="15" fill="#0D5C63" font-weight="800">5+ hrs</text>
  <text x="75" y="276" font-family="Inter, sans-serif" font-size="7.5" fill="#2D9A74" font-weight="600">Saved weekly with SQL</text>

  <!-- Right Panel: Triage Trend Timeline Chart -->
  <rect x="195" y="135" width="295" height="160" rx="8" fill="#fff" stroke="#e1dfdd" stroke-width="1"/>
  <text x="210" y="152" font-family="Inter, sans-serif" font-size="9" fill="#323130" font-weight="700">Patient Flow &amp; ER Triage Trend</text>
  
  <!-- Chart gridlines -->
  <line x1="210" y1="190" x2="475" y2="190" stroke="#f3f2f1" stroke-width="1"/>
  <line x1="210" y1="220" x2="475" y2="220" stroke="#f3f2f1" stroke-width="1"/>
  <line x1="210" y1="250" x2="475" y2="250" stroke="#f3f2f1" stroke-width="1"/>
  <line x1="210" y1="270" x2="475" y2="270" stroke="#eae8e6" stroke-width="1.5"/>
  <line x1="210" y1="165" x2="210" y2="270" stroke="#eae8e6" stroke-width="1"/>
  
  <!-- Gradient area under the line -->
  <path d="M225 240 L260 200 L295 230 L330 170 L365 210 L400 185 L435 250 L470 260 L470 270 L225 270 Z" fill="url(#pbiGrad)"/>
  
  <!-- Triage Trend Line -->
  <path d="M225 240 L260 200 L295 230 L330 170 L365 210 L400 185 L435 250 L470 260" fill="none" stroke="#0D5C63" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dots -->
  <circle cx="225" cy="240" r="3" fill="#0D5C63"/>
  <circle cx="260" cy="200" r="3" fill="#0D5C63"/>
  <circle cx="295" cy="230" r="3" fill="#0D5C63"/>
  <circle cx="330" cy="170" r="3.5" fill="#E07A5F"/>
  <circle cx="365" cy="210" r="3" fill="#0D5C63"/>
  <circle cx="400" cy="185" r="3" fill="#0D5C63"/>
  <circle cx="435" cy="250" r="3" fill="#0D5C63"/>
  <circle cx="470" cy="260" r="3" fill="#0D5C63"/>
  
  <!-- Peak Triage Tag -->
  <rect x="315" y="146" width="30" height="14" rx="3" fill="#E07A5F"/>
  <text x="330" y="156" font-family="Inter, sans-serif" font-size="7.5" fill="#fff" font-weight="700" text-anchor="middle">Peak</text>
  <line x1="330" y1="160" x2="330" y2="170" stroke="#E07A5F" stroke-width="1"/>
  
  <!-- Time Axes -->
  <text x="225" y="283" font-family="Inter, sans-serif" font-size="7.5" fill="#605e5c" font-weight="600" text-anchor="middle">10 AM</text>
  <text x="295" y="283" font-family="Inter, sans-serif" font-size="7.5" fill="#605e5c" font-weight="600" text-anchor="middle">2 PM</text>
  <text x="365" y="283" font-family="Inter, sans-serif" font-size="7.5" fill="#605e5c" font-weight="600" text-anchor="middle">6 PM</text>
  <text x="435" y="283" font-family="Inter, sans-serif" font-size="7.5" fill="#605e5c" font-weight="600" text-anchor="middle">10 PM</text>

  <!-- Title & Subtitle -->
  <text x="52" y="60" font-family="Inter, sans-serif" font-size="26" fill="#0D5C63" font-weight="700">ER Visit Report</text>
  <text x="52" y="92" font-family="Inter, sans-serif" font-size="18" fill="#5A5A5A">Power BI Emergency Room Dashboard</text>
</svg>