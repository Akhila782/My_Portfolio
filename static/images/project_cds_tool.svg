<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gradCDS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D5C63"/>
      <stop offset="100%" stop-color="#167a83"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D9A74"/>
      <stop offset="100%" stop-color="#3FA882"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" rx="24" ry="24" fill="#f7f4ee"/>
  
  <!-- CDS Tool pharmacy dispensing safe interface mockup -->
  <rect x="50" y="90" width="460" height="220" rx="16" fill="#fff" stroke="#d8d4ce" stroke-width="2"/>
  
  <!-- Modern top bar of the application window -->
  <rect x="50" y="90" width="460" height="35" rx="16" fill="#0D5C63" opacity="0.1"/>
  <rect x="50" y="105" width="460" height="20" fill="#0D5C63" opacity="0.1"/>
  
  <!-- macOS window control dots -->
  <circle cx="75" cy="107" r="5" fill="#FF5F56"/>
  <circle cx="91" cy="107" r="5" fill="#FFBD2E"/>
  <circle cx="107" cy="107" r="5" fill="#27C93F"/>
  
  <text x="130" y="111" font-family="Inter, sans-serif" font-size="10" fill="#0D5C63" font-weight="700">RxDispense - CDS Safety Guard</text>
  
  <!-- Divider -->
  <line x1="50" y1="125" x2="510" y2="125" stroke="#e8e8e8" stroke-width="1.5"/>

  <!-- Left Panel: Clinical Safety Verification Shield -->
  <rect x="70" y="140" width="190" height="150" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="70" y="140" width="190" height="4" rx="2" fill="#2D9A74"/>
  
  <text x="82" y="160" font-family="Inter, sans-serif" font-size="10" fill="#4A5568" font-weight="700">Clinical Validation</text>
  
  <!-- Safe Shield Shape -->
  <path d="M165 170 C165 170 195 160 210 170 C210 190 210 215 165 235 C120 215 120 190 120 170 C135 160 165 170 165 170 Z" fill="url(#gradGreen)" opacity="0.15" stroke="#2D9A74" stroke-width="2"/>
  <!-- Checkmark inside the shield -->
  <path d="M150 200 L160 210 L180 190" fill="none" stroke="#2D9A74" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Safe Dispensing Text below Shield -->
  <text x="165" y="255" font-family="Inter, sans-serif" font-size="11" fill="#2D9A74" font-weight="700" text-anchor="middle">SAFE TO DISPENSE</text>
  <text x="165" y="268" font-family="Inter, sans-serif" font-size="8.5" fill="#718096" font-weight="600" text-anchor="middle">85% Error Reduction</text>
  <text x="165" y="280" font-family="Inter, sans-serif" font-size="8.5" fill="#0D5C63" font-weight="700" text-anchor="middle">97% Patient Safety</text>

  <!-- Right Panel: Medication Verification Detail Lists -->
  <rect x="280" y="140" width="210" height="150" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="280" y="140" width="210" height="4" rx="2" fill="#0D5C63"/>
  
  <text x="292" y="160" font-family="Inter, sans-serif" font-size="10" fill="#4A5568" font-weight="700">Verification Checklist</text>
  
  <!-- Medication Barcode Scan Action (Active) -->
  <rect x="290" y="172" width="190" height="18" rx="4" fill="#0D5C63" opacity="0.1"/>
  <path d="M298 176 L298 186 M302 176 L302 186 M305 176 L305 186 M309 176 L309 186 M313 176 L313 186 M316 176 L316 186 M320 176 L320 186 M325 176 L325 186 M328 176 L328 186" stroke="#0D5C63" stroke-width="2" stroke-linecap="round"/>
  
  <text x="338" y="185" font-family="Inter, sans-serif" font-size="8.5" fill="#0D5C63" font-weight="700">BARCODE SCAN: VALID</text>
  
  <!-- Verification line 1: Patient Identity -->
  <circle cx="298" cy="212" r="5" fill="#2D9A74"/>
  <text x="312" y="215" font-family="Inter, sans-serif" font-size="8.5" fill="#4A5568" font-weight="700">Patient ID Verified (100%)</text>
  
  <!-- Verification line 2: Dosage Check -->
  <circle cx="298" cy="237" r="5" fill="#2D9A74"/>
  <text x="312" y="240" font-family="Inter, sans-serif" font-size="8.5" fill="#4A5568" font-weight="700">Dose Match: Metformin 500mg</text>
  
  <!-- Verification line 3: Interaction Contraindications -->
  <circle cx="298" cy="262" r="5" fill="#2D9A74"/>
  <text x="312" y="265" font-family="Inter, sans-serif" font-size="8.5" fill="#4A5568" font-weight="700">No Drug-Drug Contraindications</text>
  
  <!-- Bottom note -->
  <line x1="292" y1="274" x2="478" y2="274" stroke="#EDF2F7" stroke-width="1"/>
  <text x="292" y="284" font-family="Inter, sans-serif" font-size="7.5" fill="#718096" font-weight="500">Automated safety validation active.</text>

  <!-- Title & Subtitle -->
  <text x="52" y="60" font-family="Inter, sans-serif" font-size="26" fill="#0D5C63" font-weight="700">Clinical Decision Support</text>
  <text x="52" y="92" font-family="Inter, sans-serif" font-size="18" fill="#5A5A5A">Medication Safety &amp; CDS Systems</text>
</svg>