<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D5C63"/>
      <stop offset="100%" stop-color="#167a83"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E07A5F" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" rx="24" ry="24" fill="#f7f4ee"/>
  
  <!-- Patient Portal application window mockup -->
  <rect x="50" y="90" width="460" height="220" rx="16" fill="#fff" stroke="#d8d4ce" stroke-width="2"/>
  
  <!-- Browser top bar -->
  <rect x="50" y="90" width="460" height="40" rx="16" fill="#0D5C63" opacity="0.1"/>
  <rect x="50" y="105" width="460" height="25" fill="#0D5C63" opacity="0.1"/>
  
  <!-- macOS window control buttons -->
  <circle cx="75" cy="110" r="5" fill="#FF5F56"/>
  <circle cx="91" cy="110" r="5" fill="#FFBD2E"/>
  <circle cx="107" cy="110" r="5" fill="#27C93F"/>
  
  <!-- Medical logo & name -->
  <circle cx="135" cy="110" r="8" fill="#0D5C63"/>
  <path d="M132 110 H138 M135 107 V113" stroke="#fff" stroke-width="1.5"/>
  <text x="150" y="114" font-family="Inter, sans-serif" font-size="11" fill="#0D5C63" font-weight="700">MyChart</text>
  
  <!-- Navigation tabs -->
  <text x="270" y="113" font-family="Inter, sans-serif" font-size="9" fill="#0D5C63" font-weight="700">Dashboard</text>
  <text x="340" y="113" font-family="Inter, sans-serif" font-size="9" fill="#5A5A5A" font-weight="500">Messages</text>
  <text x="410" y="113" font-family="Inter, sans-serif" font-size="9" fill="#5A5A5A" font-weight="500">Vitals</text>
  <rect x="270" y="122" width="48" height="2" rx="1" fill="#0D5C63"/>
  
  <!-- Divider -->
  <line x1="50" y1="130" x2="510" y2="130" stroke="#e8e8e8" stroke-width="1.5"/>

  <!-- Left Panel: Portal Adoption Rate -->
  <rect x="70" y="145" width="195" height="145" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="70" y="145" width="195" height="4" rx="2" fill="#0D5C63"/>
  <text x="82" y="165" font-family="Inter, sans-serif" font-size="10" fill="#4A5568" font-weight="700">Portal Adoption Rate</text>
  
  <text x="82" y="195" font-family="Inter, sans-serif" font-size="20" fill="#0D5C63" font-weight="800">85%</text>
  <text x="82" y="208" font-family="Inter, sans-serif" font-size="8.5" fill="#718096" font-weight="600">Active Patient Adoption</text>
  
  <!-- Donut Chart -->
  <circle cx="195" cy="205" r="28" fill="none" stroke="#E2E8F0" stroke-width="8"/>
  <circle cx="195" cy="205" r="28" fill="none" stroke="#0D5C63" stroke-width="8" stroke-dasharray="149.5 176" stroke-dashoffset="0" transform="rotate(-90 195 205)" stroke-linecap="round"/>
  <text x="195" y="208" font-family="Inter, sans-serif" font-size="9" fill="#0D5C63" font-weight="700" text-anchor="middle">85%</text>

  <!-- Left Panel Legends -->
  <rect x="82" y="235" width="6" height="6" rx="1.5" fill="#0D5C63"/>
  <text x="92" y="240" font-family="Inter, sans-serif" font-size="8" fill="#4A5568" font-weight="600">Active (8,420 Patients)</text>
  
  <rect x="82" y="250" width="6" height="6" rx="1.5" fill="#A0AEC0"/>
  <text x="92" y="255" font-family="Inter, sans-serif" font-size="8" fill="#4A5568" font-weight="600">Inactive (1,485 Patients)</text>
  
  <line x1="82" y1="268" x2="183" y2="268" stroke="#EDF2F7" stroke-width="1"/>
  <text x="82" y="280" font-family="Inter, sans-serif" font-size="7.5" fill="#718096" font-weight="500">Target: 90% by Q4 2026</text>

  <!-- Right Panel: Clinical Outcomes (HbA1c Reduction) -->
  <rect x="295" y="145" width="195" height="145" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="295" y="145" width="195" height="4" rx="2" fill="#E07A5F"/>
  <text x="307" y="165" font-family="Inter, sans-serif" font-size="10" fill="#4A5568" font-weight="700">Clinical Outcomes (HbA1c)</text>
  
  <text x="307" y="195" font-family="Inter, sans-serif" font-size="20" fill="#E07A5F" font-weight="800">-0.4%</text>
  <text x="307" y="208" font-family="Inter, sans-serif" font-size="8.5" fill="#718096" font-weight="600">Mean HbA1c Reduction</text>
  
  <!-- Trend Chart Gridlines -->
  <line x1="310" y1="230" x2="475" y2="230" stroke="#F7FAFC" stroke-width="1"/>
  <line x1="310" y1="250" x2="475" y2="250" stroke="#F7FAFC" stroke-width="1"/>
  <line x1="310" y1="270" x2="475" y2="270" stroke="#EDF2F7" stroke-width="1.5"/>
  
  <!-- Gradient fill under trend line -->
  <path d="M325 225 L360 233 L395 245 L430 253 L465 265 L465 270 L325 270 Z" fill="url(#chartGrad)"/>

  <!-- Downward HbA1c Trend Line -->
  <path d="M325 225 L360 233 L395 245 L430 253 L465 265" fill="none" stroke="#E07A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Trend Dots -->
  <circle cx="325" cy="225" r="3.5" fill="#E07A5F"/>
  <circle cx="360" cy="233" r="3.5" fill="#E07A5F"/>
  <circle cx="395" cy="245" r="3.5" fill="#E07A5F"/>
  <circle cx="430" cy="253" r="3.5" fill="#E07A5F"/>
  <circle cx="465" cy="265" r="3.5" fill="#E07A5F"/>
  
  <!-- Value Labels -->
  <text x="325" y="217" font-family="Inter, sans-serif" font-size="7.5" fill="#718096" font-weight="700" text-anchor="middle">8.2%</text>
  <text x="395" y="237" font-family="Inter, sans-serif" font-size="7.5" fill="#718096" font-weight="700" text-anchor="middle">7.7%</text>
  <text x="465" y="257" font-family="Inter, sans-serif" font-size="7.5" fill="#E07A5F" font-weight="700" text-anchor="middle">7.2%</text>
  
  <!-- Months -->
  <text x="325" y="282" font-family="Inter, sans-serif" font-size="8" fill="#A0AEC0" font-weight="600" text-anchor="middle">Jan</text>
  <text x="395" y="282" font-family="Inter, sans-serif" font-size="8" fill="#A0AEC0" font-weight="600" text-anchor="middle">May</text>
  <text x="465" y="282" font-family="Inter, sans-serif" font-size="8" fill="#A0AEC0" font-weight="600" text-anchor="middle">Sep</text>

  <!-- Title & Subtitle -->
  <text x="52" y="60" font-family="Inter, sans-serif" font-size="26" fill="#0D5C63" font-weight="700">Patient Portals</text>
  <text x="52" y="92" font-family="Inter, sans-serif" font-size="18" fill="#5A5A5A">Diabetes Management Review</text>
</svg>