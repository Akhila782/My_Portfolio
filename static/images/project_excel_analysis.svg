  <text x="225" y="170" font-family="Inter, sans-serif" font-size="10" fill="#5A5A5A" font-weight="700">Visualized Trends</text>
  
  <!-- Mini Bar Chart inside excel -->
  <rect x="235" y="220" width="20" height="40" fill="url(#grad5)" rx="4"/>
  <rect x="270" y="180" width="20" height="80" fill="url(#grad5)" rx="4"/>
  <rect x="305" y="200" width="20" height="60" fill="#E07A5F" rx="4"/>
  
