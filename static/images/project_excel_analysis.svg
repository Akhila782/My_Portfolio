  <text x="245" y="272" font-family="Inter, sans-serif" font-size="8" fill="#7A7A7A" font-weight="600" text-anchor="middle">2023</text>
  <text x="280" y="272" font-family="Inter, sans-serif" font-size="8" fill="#7A7A7A" font-weight="600" text-anchor="middle">2024</text>
  <text x="315" y="272" font-family="Inter, sans-serif" font-size="8" fill="#7A7A7A" font-weight="600" text-anchor="middle">2025</text>

  <!-- Right Card: Pivot & DAX KPI Metric Summary -->
  <rect x="360" y="150" width="130" height="130" rx="8" stroke="#e0e0e0" fill="#fff" stroke-width="1.5"/>
  <rect x="360" y="150" width="130" height="4" rx="2" fill="#107C41"/>
  <text x="372" y="172" font-family="Inter, sans-serif" font-size="10" fill="#5A5A5A" font-weight="700">DAX KPI Card</text>
  
  <text x="372" y="200" font-family="Inter, sans-serif" font-size="20" fill="#107C41" font-weight="700">30%</text>
  <text x="372" y="213" font-family="Inter, sans-serif" font-size="8" fill="#7A7A7A" font-weight="600">Reporting Time Saved</text>
  
  <line x1="372" y1="225" x2="478" y2="225" stroke="#e8e8e8" stroke-width="1"/>
  
  <text x="372" y="245" font-family="Inter, sans-serif" font-size="15" fill="#E07A5F" font-weight="700">15%</text>
  <text x="372" y="258" font-family="Inter, sans-serif" font-size="8" fill="#7A7A7A" font-weight="600">Resource Cost Saved</text>
  
  <rect x="372" y="267" width="55" height="10" rx="3" fill="#107C41" opacity="0.15"/>
  <text x="376" y="275" font-family="Inter, sans-serif" font-size="7" fill="#107C41" font-weight="700">Slicer: ACTIVE</text>

  <text x="52" y="60" font-family="Inter, sans-serif" font-size="26" fill="#0D5C63" font-weight="700">Advanced Excel Analytics</text>
  <text x="52" y="92" font-family="Inter, sans-serif" font-size="18" fill="#5A5A5A">Data Transformation &amp; Reporting</text>
