<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#1F9A55"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" rx="24" ry="24" fill="#f7f4ee"/>
  <!-- Excel grid and dashboard look -->
  <rect x="50" y="90" width="460" height="220" rx="16" fill="#fff" stroke="#d8d4ce" stroke-width="2"/>
  <rect x="70" y="110" width="420" height="30" fill="url(#grad5)" rx="6"/>
  <rect x="90" y="118" width="60" height="14" rx="3" fill="#fff" opacity="0.9"/>
  <!-- Top bar search label decoration -->
  <text x="100" y="128" font-family="Inter, sans-serif" font-size="8" fill="#107C41" font-weight="700">Power Query</text>

  <!-- Left Card: Excel Spreadsheet Grid -->
  <rect x="70" y="150" width="130" height="130" rx="8" stroke="#e0e0e0" fill="#fff" stroke-width="1.5"/>
  <rect x="70" y="150" width="130" height="22" fill="#107C41" rx="4"/>
  <text x="75" y="164" font-family="Inter, sans-serif" font-size="8" fill="#fff" font-weight="700">Metric</text>
  <text x="122" y="164" font-family="Inter, sans-serif" font-size="8" fill="#fff" font-weight="700">Actual</text>
  <text x="168" y="164" font-family="Inter, sans-serif" font-size="8" fill="#fff" font-weight="700">Var</text>

  <rect x="70" y="172" width="130" height="20" fill="#f4fbf7"/>
  <text x="75" y="185" font-family="Inter, sans-serif" font-size="8" fill="#333" font-weight="500">Admit</text>
  <text x="122" y="185" font-family="Inter, sans-serif" font-size="8" fill="#333" font-weight="600">4,210</text>
  <text x="168" y="185" font-family="Inter, sans-serif" font-size="8" fill="#107C41" font-weight="600">+4%</text>

  <rect x="70" y="192" width="130" height="20" fill="#fff"/>
  <text x="75" y="205" font-family="Inter, sans-serif" font-size="8" fill="#333" font-weight="500">ER Out</text>
  <text x="122" y="205" font-family="Inter, sans-serif" font-size="8" fill="#333" font-weight="600">1,850</text>
  <text x="168" y="205" font-family="Inter, sans-serif" font-size="8" fill="#E07A5F" font-weight="600">-2%</text>

  <rect x="70" y="212" width="130" height="20" fill="#f4fbf7"/>
  <text x="75" y="225" font-family="Inter, sans-serif" font-size="8" fill="#333" font-weight="500">OP Care</text>
  <text x="122" y="225" font-family="Inter, sans-serif" font-size="8" fill="#333" font-weight="600">8,940</text>
  <text x="168" y="225" font-family="Inter, sans-serif" font-size="8" fill="#107C41" font-weight="600">+12%</text>

  <!-- Cell borders -->
  <line x1="70" y1="172" x2="200" y2="172" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="70" y1="192" x2="200" y2="192" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="70" y1="212" x2="200" y2="212" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="70" y1="232" x2="200" y2="232" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="116" y1="150" x2="116" y2="232" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="162" y1="150" x2="162" y2="232" stroke="#e0e0e0" stroke-width="1"/>
  <text x="75" y="255" font-family="Inter, sans-serif" font-size="8" fill="#7A7A7A" font-weight="500">Sheet: "KPI_Data"</text>

  <!-- Middle Card: Bar Chart Visualizer -->
